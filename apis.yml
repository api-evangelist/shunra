name: Shunra
description: >-
  Shunra Software (founded 1997, Philadelphia, Pennsylvania) was an application
  performance engineering and network virtualization vendor whose products let
  teams emulate real-world network conditions to test application and mobile
  performance before deployment. Hewlett-Packard acquired Shunra's network
  virtualization business in March 2014 to expand its LoadRunner and Performance
  Center mobile-testing capabilities; the technology moved to HPE's software
  division and then to Micro Focus in 2016 (now part of OpenText). Shunra no
  longer operates as an independent company: the shunra.com domain redirects to
  HPE's domain-redirect 404 handler (nameservers softwaregrp.com) and there is
  no live product, developer portal, documentation, or public API surface. This
  profile was surfaced as an Insight Partners portfolio lead but resolves to a
  defunct/absorbed company with nothing to enrich.
